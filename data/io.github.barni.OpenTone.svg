<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f36"/><stop offset="1" stop-color="#16181c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a36"/><stop offset="1" stop-color="#ffb02e"/>
    </linearGradient>
  </defs>
  <!-- stompbox body -->
  <rect x="18" y="10" width="92" height="108" rx="16" fill="url(#body)"/>
  <rect x="18" y="10" width="92" height="108" rx="16" fill="none" stroke="#3d434d" stroke-width="2"/>
  <!-- knobs -->
  <g fill="#0e0f12" stroke="#4a515c" stroke-width="2">
    <circle cx="40" cy="34" r="10"/><circle cx="64" cy="34" r="10"/><circle cx="88" cy="34" r="10"/>
  </g>
  <g stroke="#ff8a30" stroke-width="3" stroke-linecap="round">
    <line x1="40" y1="34" x2="34" y2="28"/><line x1="64" y1="34" x2="64" y2="25"/><line x1="88" y1="34" x2="94" y2="28"/>
  </g>
  <!-- LED -->
  <circle cx="64" cy="58" r="4.5" fill="#ff5a36"/>
  <circle cx="64" cy="58" r="9" fill="#ff5a36" opacity="0.25"/>
  <!-- "open" ring + footswitch -->
  <circle cx="64" cy="92" r="17" fill="none" stroke="url(#glow)" stroke-width="5" stroke-dasharray="80 27" stroke-linecap="round" transform="rotate(-50 64 92)"/>
  <circle cx="64" cy="92" r="9" fill="#c9ced6"/>
  <circle cx="64" cy="92" r="5" fill="#8d949e"/>
</svg>
