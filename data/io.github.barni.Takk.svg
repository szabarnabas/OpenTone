<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Takk: a metronome with a swinging arm and a "beat" dot. Own design, MIT. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3846"/>
      <stop offset="1" stop-color="#241f31"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d32d"/>
      <stop offset="1" stop-color="#e5a50a"/>
    </linearGradient>
  </defs>
  <!-- base shadow -->
  <rect x="18" y="108" width="92" height="10" rx="5" fill="#000" opacity="0.18"/>
  <!-- body: rounded trapezoid -->
  <path d="M52 10 h24 a6 6 0 0 1 5.8 4.5 L104.5 104 a7 7 0 0 1 -6.8 8.8 H30.3 a7 7 0 0 1 -6.8 -8.8 L46.2 14.5 A6 6 0 0 1 52 10 z"
        fill="url(#body)"/>
  <!-- face -->
  <path d="M55 20 h18 l17.5 66 H37.5 z" fill="url(#face)"/>
  <!-- scale ticks -->
  <g stroke="#3d3846" stroke-width="2.4" stroke-linecap="round" opacity="0.55">
    <path d="M64 27 v6"/><path d="M64 40 v6"/><path d="M64 53 v6"/><path d="M64 66 v6"/>
  </g>
  <!-- foot panel -->
  <path d="M35.4 92 h57.2 l4 15 H31.4 z" fill="#5e5c64"/>
  <circle cx="64" cy="99.5" r="4.2" fill="#ed333b"/>
  <!-- pendulum arm, swung to the right, pivot near the foot -->
  <g transform="rotate(24 64 92)">
    <rect x="61.6" y="14" width="4.8" height="80" rx="2.4" fill="#f6f5f4"/>
    <rect x="55" y="36" width="18" height="13" rx="3.5" fill="#f6f5f4"/>
    <rect x="58" y="40" width="12" height="5" rx="2" fill="#9a9996"/>
  </g>
  <circle cx="64" cy="92" r="4.6" fill="#f6f5f4"/>
  <circle cx="64" cy="92" r="2" fill="#5e5c64"/>
</svg>
